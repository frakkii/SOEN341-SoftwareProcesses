spring.application.name=demo
server.port=8081

# Supabase Postgres (session pooler). The password is never committed:
# set SUPABASE_DB_PASSWORD in your environment before running the app.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.vwfsxrpukumklvboxbow}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
# common/ runs everywhere; {vendor} picks postgresql/ or h2/ for database-specific SQL.
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
# The tables already existed in Supabase before Flyway, so treat them as version 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
