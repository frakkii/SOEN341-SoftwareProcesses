<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - My Applications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
<!-- Top navigation bar is rendered by js/shell.js (also redirects to the login page if not logged in) -->

<main class="wrap">
    <div class="page-title">
        <h1>My applications</h1>
        <p>Track every application from Applied through to a final decision.</p>
    </div>

    <div class="message error hidden" id="list-message"></div>
    <div class="apps" id="apps"></div>
    <div class="card empty hidden" id="empty">
        <p>No applications yet.</p>
        <p style="margin-top:14px"><a class="btn primary" href="jobs.html">Find jobs to apply to</a></p>
    </div>
</main>

<script src="js/shell.js"></script>
<script>
(function () {
    if (!window.CC) return;                       // redirecting to login
    const { esc, api, colorFor } = CC;
    const STEPS = ["Applied", "Under Review", "Interview", "Offered"];

    // One bar per stage. A rejection replaces the last stage and marks the stage it ended at.
    function steps(status) {
        const rejected = status === "Rejected";
        return `<ol class="steps" aria-label="Application progress: ${esc(status)}">${STEPS.map((step, i) => {
            if (rejected && i === 3) return `<li class="no">Rejected</li>`;
            const reached = !rejected && i <= STEPS.indexOf(status);
            const cls = reached ? (step === status ? "done now" : "done") : "";
            return `<li class="${cls}"${step === status ? ' aria-current="step"' : ""}>${step}</li>`;
        }).join("")}</ol>`;
    }

    function card(app) {
        const title = app.jobTitle || `Posting #${app.postId}`;
        const company = app.companyName || "";
        const [c1, c2] = colorFor(company || title);
        const day = iso => new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        return `<article class="card app">
            <div class="app-top">
                <div class="logo" aria-hidden="true" style="--c1:${c1};--c2:${c2};width:46px;height:46px;font-size:1.1rem">${esc((company || title)[0])}</div>
                <div class="who">
                    <h3><a href="job.html?id=${encodeURIComponent(app.postId)}">${esc(title)}</a></h3>
                    <small>${company ? esc(company) + " · " : ""}Applied ${day(app.appliedAt)} · Updated ${day(app.updatedAt)}</small>
                </div>
                <span class="status ${app.status.toLowerCase().replace(/\s+/g, "-")}">${esc(app.status)}</span>
            </div>
            ${steps(app.status)}
        </article>`;
    }

    api("/api/applications").then(apps => {
        document.getElementById("apps").innerHTML = apps.map(card).join("");
        document.getElementById("empty").classList.toggle("hidden", apps.length > 0);
    }).catch(err => {
        const el = document.getElementById("list-message");
        el.textContent = err.status === 403 ? "Only job seekers have applications." : "Couldn't load your applications. " + err.message;
        el.classList.remove("hidden");
    });
})();
</script>
</body>
</html>
