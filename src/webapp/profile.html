<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
<!-- Top navigation bar is rendered by js/shell.js -->

<main class="wrap profile-grid">
    <div class="p-main">

        <!-- Cover + avatar + intro -->
        <section class="card hero-card">
            <div class="cover" id="cover">
                <button type="button" class="cover-edit" id="cover-btn"></button>
                <input type="file" id="cover-file" accept="image/*" hidden>
            </div>
            <div class="p-head">
                <div class="avatar-wrap">
                    <span class="ring"><span class="av" data-me></span></span>
                    <button type="button" class="av-edit" id="avatar-btn" aria-label="Change profile photo"></button>
                    <input type="file" id="avatar-file" accept="image/*" hidden>
                </div>
                <div class="p-id">
                    <h1 id="p-name"></h1>
                    <p class="headline" id="p-headline"></p>
                    <ul class="facts">
                        <li id="p-loc"></li>
                        <li id="p-conn"></li>
                    </ul>
                </div>
                <div class="p-actions">
                    <span class="open-pill">Open to work</span>
                    <button type="button" class="btn primary" id="edit-btn"></button>
                </div>
            </div>
        </section>

        <section class="card sec">
            <div class="sec-h"><h2>About</h2><button type="button" class="icon-btn" id="edit-about" aria-label="Edit about"></button></div>
            <p class="about" id="p-about"></p>
        </section>

        <section class="card sec">
            <div class="sec-h"><h2>Skills</h2><button type="button" class="icon-btn" id="edit-skills" aria-label="Edit skills"></button></div>
            <div class="skills" id="p-skills"></div>
        </section>
    </div>

    <aside class="p-side" aria-label="Profile extras">
        <section class="card pad">
            <h2 class="side-title">Your CV</h2>
            <div class="cv-state" id="cv-state"></div>
            <a class="btn block" href="resume.html" style="margin-top:14px">Manage CVs</a>
        </section>

        <section class="card pad">
            <h2 class="side-title">Profile strength</h2>
            <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="strength-bar"><i></i></div>
            <p class="muted" id="strength-text" style="margin-top:10px;font-size:.88rem"></p>
        </section>

        <section class="card pad">
            <h2 class="side-title">People you may know</h2>
            <ul class="list" id="people"></ul>
        </section>
    </aside>
</main>

<dialog id="edit-dialog" aria-labelledby="dlg-title">
    <form class="dlg" method="dialog" id="edit-form">
        <h2 id="dlg-title">Edit profile</h2>
        <div class="field"><label for="f-headline">Headline</label>
            <input id="f-headline" maxlength="120" placeholder="Software engineering student, open to co-op roles"></div>
        <div class="field"><label for="f-city">City</label>
            <input id="f-city" maxlength="50" required placeholder="Montréal"></div>
        <div class="field"><label for="f-province">Province / State</label>
            <input id="f-province" maxlength="50" required placeholder="Quebec"></div>
        <div class="field"><label for="f-about">About</label>
            <textarea id="f-about" maxlength="1200" placeholder="Tell employers what you are great at and what you want to do next."></textarea></div>
        <div class="field"><label for="f-skills">Skills</label>
            <input id="f-skills" maxlength="500" placeholder="Java, SQL, Git">
            <p class="hint">Separate skills with commas (up to 20).</p></div>
        <p class="message error hidden" id="edit-error"></p>
        <div class="dlg-bar">
            <button type="button" class="btn" id="cancel-edit">Cancel</button>
            <button type="submit" class="btn primary">Save changes</button>
        </div>
    </form>
</dialog>

<script src="js/shell.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
