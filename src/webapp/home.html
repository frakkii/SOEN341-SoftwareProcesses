<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - Jobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app">
<!-- CareerConnect logo + navigation bar -->
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="home.html">
            <div>
                <h1>CareerConnect</h1>
                <p>Welcome back, <span id="username"></span></p>
            </div>
        </a>

        <nav>
            <a href="home.html" class="active">Home</a>

            <!-- My Tools: dropdown menu -->
            <div class="dropdown">
                <a href="#">My Tools ▾</a>
                <div class="dropdown-menu">
                    <a href="resume.html">My CVs &amp; Cover Letters</a>
                    <a href="#">Favourited Postings</a>
                    <a href="applications.html">My Applications</a>
                </div>
            </div>

            <a href="#">Messages</a>
            <a href="#">Settings</a>
            <a class="avatar" href="profile.html" id="nav-avatar" aria-label="View profile">👤</a>
        </nav>
    </div>
</header>

<main class="page">
    <form class="search-bar" id="search-form" onsubmit="return false">
        <input type="text" id="job-search" placeholder="Search by job title, company or location">
        <button type="submit">🔍 Search</button>
    </form>

    <div class="job-layout">
        <div>
            <div class="job-list" id="job-list"></div>
            <div id="pagination"></div>
        </div>
        <aside class="job-detail" id="job-detail"></aside>
    </div>
</main>

<!-- Check for username if user connected so that it can appear
 on dashboard, otherwise send back to login -->
<script>
    const name = localStorage.getItem("userName");        // read the saved name
    if (name) {
        document.getElementById("username").textContent = name;
    } else {
        window.location.href = "index.html";              // not logged in → back to login
    }

    // Profile photos have no backend support yet, so they're kept per-browser
    // in localStorage (set on profile.html) and mirrored into the nav avatar here.
    const savedPhoto = localStorage.getItem("cc_profile_photo");
    if (savedPhoto) {
        document.getElementById("nav-avatar").innerHTML = `<img src="${savedPhoto}" alt="Profile photo">`;
    }
</script>

<!-- Mock postings: there's no postings-browse API yet, so this is placeholder
 data. "Apply now" links into the real /api/applications flow on applications.html. -->
<script>

        },
        {

        },

            responsibilities: ["Maintain CI/CD pipelines", "Manage cloud infrastructure as code", "Monitor system health and respond to incidents", "Improve deployment speed and reliability"],

        },

            responsibilities: ["Respond to customer tickets via chat and email", "Troubleshoot common account issues", "Escalate bugs to the engineering team", "Maintain the internal help center"],

        },
        {
            id: 11, title: "Data Scientist", company: "Clearwater Analytics",
            location: "Ottawa, ON", mode: "Remote", salary: "$95K – $115K / yr",
            type: "Full-time", posted: "1 day ago", match: 90,
            description: "Clearwater Analytics is hiring a Data Scientist to build predictive models that power our clients' forecasting tools.",
            responsibilities: ["Build and validate predictive models", "Clean and prepare large data sets", "Communicate findings to stakeholders", "Collaborate with engineering on model deployment"],
            requirements: ["Experience with Python and pandas/scikit-learn", "Strong statistics fundamentals", "Experience deploying models to production", "Master's degree or equivalent experience preferred"]
        },
        {
            id: 12, title: "Graphic Designer", company: "Pixel Studio",
            location: "Remote", mode: "Remote", salary: "$35 – $48 / hr",
            type: "Contract", posted: "4 days ago", match: 72,
            description: "Pixel Studio is looking for a Graphic Designer to produce marketing assets for a handful of ongoing client campaigns.",
            responsibilities: ["Design social and web marketing assets", "Maintain brand consistency across campaigns", "Iterate quickly based on client feedback", "Prepare final files for production"],
            requirements: ["Portfolio of marketing or brand design work", "Proficiency in Figma or Adobe Creative Suite", "Comfortable managing multiple projects at once", "Strong eye for typography and layout"]
        },
        {
            id: 13, title: "Security Engineer", company: "SecureNet Inc.",
            location: "Toronto, ON", mode: "In person", salary: "$90K – $105K / yr",
            type: "Full-time", posted: "6 days ago", match: 86,
            description: "SecureNet Inc. is hiring a Security Engineer to help protect our infrastructure and lead internal security reviews.",
            responsibilities: ["Run vulnerability assessments and penetration tests", "Review code and infrastructure for security issues", "Respond to security incidents", "Maintain security policies and documentation"],
            requirements: ["Experience in application or infrastructure security", "Familiarity with common security tooling", "Relevant certification (e.g. Security+, CEH) is a plus", "Clear written documentation skills"]
        }
    ];

    let selectedId = JOBS[0].id;
    let currentPage = 1;
    const PAGE_SIZE = 5;

    function getFilteredJobs() {
        const q = document.getElementById("job-search").value.trim().toLowerCase();
        if (!q) return JOBS;
        return JOBS.filter(j =>
            j.title.toLowerCase().includes(q) ||
            j.company.toLowerCase().includes(q) ||
            j.location.toLowerCase().includes(q)
        );
    }

    function renderPagination(totalPages, totalCount) {
        const el = document.getElementById("pagination");
        if (totalPages <= 1) {
            el.innerHTML = "";
            return;
        }
        let buttons = "";
        for (let p = 1; p <= totalPages; p++) {
            buttons += `<button class="page-btn ${p === currentPage ? "active" : ""}" data-page="${p}">${p}</button>`;
        }
        el.innerHTML = `
            <div class="page-info">Page ${currentPage} of ${totalPages} &middot; ${totalCount} postings</div>
            <div class="pagination">${buttons}</div>
        `;
        el.querySelectorAll(".page-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                currentPage = Number(btn.dataset.page);
                renderJobList();
                renderJobDetail();
            });
        });
    }

    function renderJobList() {
        const list = document.getElementById("job-list");
        const filtered = getFilteredJobs();

        if (filtered.length === 0) {
            list.innerHTML = `<p class="no-results">No postings match your search.</p>`;
            document.getElementById("pagination").innerHTML = "";
            document.getElementById("job-detail").innerHTML = "";
            return;
        }

        const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
        currentPage = Math.min(Math.max(currentPage, 1), totalPages);
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(start, start + PAGE_SIZE);

        if (!pageItems.some(j => j.id === selectedId)) {
            selectedId = pageItems[0].id;
        }

        list.innerHTML = pageItems.map(j => `
            <article class="job-card ${j.id === selectedId ? "selected" : ""}" data-id="${j.id}">
                <div class="job-card-top">
                    <div>
                        <h3>${j.title}</h3>
                        <span class="job-company">${j.company}</span>
                    </div>
                    <div class="job-actions">
                        <button class="icon-btn fav" type="button" aria-label="Favourite this posting">🤍</button>
                        <button class="icon-btn save" type="button" aria-label="Save this posting">🔖</button>
                    </div>
                </div>
                <div class="job-meta">
                    <span>📍 ${j.location}</span>
                    <span>🏢 ${j.mode}</span>
                    <span>💰 ${j.salary}</span>
                    <span>🕒 ${j.type}</span>
                </div>
                <div class="job-footer">
                    <span>Posted ${j.posted}</span>
                    <span class="match-badge">${j.match}% match</span>
                </div>
            </article>
        `).join("");

        list.querySelectorAll(".job-card").forEach(card => {
            card.addEventListener("click", () => {
                selectedId = Number(card.dataset.id);
                renderJobList();
                renderJobDetail();
            });
        });
        list.querySelectorAll(".icon-btn").forEach(btn => {
            btn.addEventListener("click", event => {
                event.stopPropagation();
                btn.classList.toggle("active");
                if (btn.classList.contains("fav")) {
                    btn.textContent = btn.classList.contains("active") ? "❤️" : "🤍";
                }
            });
        });

        renderPagination(totalPages, filtered.length);
    }

    function renderJobDetail() {
        if (getFilteredJobs().length === 0) {
            return;
        }
        const j = JOBS.find(x => x.id === selectedId);
        document.getElementById("job-detail").innerHTML = `
            <h3>${j.title}</h3>
            <span class="job-company">${j.company}</span>
            <div class="job-meta">
                <span>📍 ${j.location}</span>
                <span>🏢 ${j.mode}</span>
                <span>💰 ${j.salary}</span>
                <span>🕒 ${j.type}</span>
            </div>
            <p>${j.description}</p>
            <strong>What you'll do</strong>
            <ul>${j.responsibilities.map(r => `<li>${r}</li>`).join("")}</ul>
            <strong>What we're looking for</strong>
            <ul>${j.requirements.map(r => `<li>${r}</li>`).join("")}</ul>
            <a class="btn inline" href="applications.html?postId=${j.id}">Apply now</a>
        `;
    }

    document.getElementById("job-search").addEventListener("input", () => {
        currentPage = 1;
        renderJobList();
        renderJobDetail();
    });

    renderJobList();
    renderJobDetail();
</script>
</body>
</html>
