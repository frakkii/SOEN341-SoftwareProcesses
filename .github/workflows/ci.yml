# Builds the backend and runs its tests on every push and pull request to main.
# Tests use in-memory H2 (src/backend/src/test/resources/application.properties),
# so no Supabase credentials are needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: src/backend/target/surefire-reports/

  # Unit tests for the browser-side dashboard logic (src/webapp/js/analytics.js, charts.js).
  # Uses Node's built-in test runner, so there is nothing to npm install.
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run dashboard tests
        run: node --test src/webapp/tests/analytics.test.js
