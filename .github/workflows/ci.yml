# Builds the backend and runs its tests on every push (any branch) and on every
# pull request to main, so feature branches get feedback before a PR is opened.
# Tests use in-memory H2 (src/backend/src/test/resources/application.properties),
# so no Supabase credentials are needed here.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run that is still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      # Totals per test class on the run's Summary page, so nobody has to download the reports
      - name: Test summary
        if: always()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-*.xml)
          {
            echo "## Backend tests"
            if [ ${#reports[@]} -eq 0 ]; then
              echo "No test reports were produced (the build failed before the tests ran)."
              exit 0
            fi
            echo "| Test class | Tests | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|"
            total=0; bad=0; skipped=0
            for f in "${reports[@]}"; do
              head=$(grep -m1 -o '<testsuite [^>]*>' "$f")
              attr() { echo "$head" | grep -o " $1=\"[^\"]*\"" | cut -d'"' -f2; }
              t=$(attr tests); fl=$(attr failures); e=$(attr errors); s=$(attr skipped)
              echo "| $(attr name | sed 's/.*\.//') | $t | $fl | $e | $s |"
              total=$((total + t)); bad=$((bad + fl + e)); skipped=$((skipped + s))
            done
            echo
            echo "**$total tests, $bad failed, $skipped skipped**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: src/backend/target/surefire-reports/

  # Unit tests for the browser-side dashboard logic (src/webapp/js/analytics.js, charts.js).
  # Uses Node's built-in test runner, so there is nothing to npm install.
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run dashboard tests
        run: node --test src/webapp/tests/analytics.test.js
