<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - Sprint 1 Auth Demo</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #4b5563;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: var(--primary-hover); }
        .hidden { display: none !important; }

        .user-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTHENTICATION VIEW -->
    <div id="login-card" class="card">
        <h2>CareerConnect</h2>
        <div class="subtitle">Job Search & Application Tracking</div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="For Example: seeker">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role">
                    <option value="Job Seeker">Job Seeker</option>
                    <option value="Recruiter">Recruiter</option>
                </select>
            </div>
            <button type="submit">Sign In / Register</button>
        </form>
    </div>

    <!-- PROTECTED DASHBOARD VIEW (Simulated State Swap) -->
    <div id="dashboard" class="card hidden">
        <span id="display-role" class="user-badge">Job Seeker</span>
        <h2>Welcome, <span id="display-username">User</span>!</h2>
        <p class="subtitle">Session authenticated cleanly.</p>

        <div style="border-top: 1px solid #e5e7eb; padding-top: 12px; font-size: 14px;">
            <p><strong>Sprint 1 Milestones Met:</strong></p>
            <ul style="padding-left: 20px; color: var(--text-muted);">
                <li>User Registration/Login UI functional.</li>
                <li>Environment and folder architecture configured.</li>
            </ul>
        </div>
        <button onclick="handleLogout()" style="background-color: #ef4444;">Disconnect</button>
    </div>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const role = document.getElementById('role').value;

        // ELEC 366 Connection Rejection Logic Concept Remnant
        if(username.toLowerCase() === "jack") {
            alert("Connection rejected: Username 'Jack' is locked by an active session thread.");
            return;
        }

        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('display-username').innerText = username;
        document.getElementById('display-role').innerText = role;
    }

    function handleLogout() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('login-card').classList.remove('hidden');
    }
</script>
</body>
</html>
